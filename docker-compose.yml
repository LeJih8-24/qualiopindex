services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tool
      POSTGRES_PASSWORD: tool
      POSTGRES_DB: tool
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tool -d tool"]
      interval: 3s
      timeout: 3s
      retries: 10

  qualiopi:
    build: .
    ports:
      - "4200:4200"
    environment:
      PORT: "4200"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: tool
      DB_PASSWORD: tool
      DB_NAME: tool
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: